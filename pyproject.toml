[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telos-governance"
version = "3.0.0"
description = "TEL-OS v3.0: Spherical Representation Steering for LLM Jailbreak Defense"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Josue Gutierrez Alvarez Tostado"},
]
keywords = ["llm", "jailbreak", "defense", "slerp", "representation-steering", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "numpy>=1.21.0",
    "accelerate>=0.24.0",
    "huggingface-hub>=0.19.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jostoz/tel-os"
Repository = "https://github.com/jostoz/tel-os.git"
Paper = "https://arxiv.org/abs/XXXX.XXXXX"
Vectors = "https://huggingface.co/Josstos/telos-vector"

[tool.setuptools.packages.find]
where = ["."]
include = ["telos*"]
